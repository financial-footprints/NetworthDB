[workspace]
resolver = "2"
members = [
    "src/packages/encryption",
    "src/packages/logger",
    "src/packages/statements",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "AGPL-3.0"
publish = false

[workspace.dependencies]
napi = { version = "3", features = ["async", "serde-json", "tokio_rt"] }
napi-derive = "3"
napi-build = "2.4"
chrono = { version = "0.4", features = ["clock"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }

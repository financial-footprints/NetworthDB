services:
  postgres:
    image: postgres:18.3
    ports:
      - "5451:5432"
    environment:
      POSTGRES_DB: networthdb
      POSTGRES_USER: networthdb
      POSTGRES_PASSWORD: networthdb
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U networthdb -d networthdb"]
      interval: 2s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
